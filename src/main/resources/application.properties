# --- Autenticacion / JWT ---
# Se excluye el dispatch ERROR de la cadena de seguridad: si no, el forward
# interno a /error se vuelve a autorizar y los errores reales del framework
# (404, 405, 415, 500) se enmascaran todos como 401 "Sesión no iniciada".
spring.security.filter.dispatcher-types=request,async

# El secreto debe tener al menos 32 bytes para que HS256 sea aceptable.
# En produccion debe inyectarse por variable de entorno, NO dejar aqui.
app.jwt.secret=unamba-apirfds220262-dev-secret-key-change-me-9f2c7a1b4e6d8c0f3a5b
app.jwt.expiration-minutes=120

